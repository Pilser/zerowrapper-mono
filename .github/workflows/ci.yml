name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Install wild linker
        run: |
          curl -sL https://github.com/wild-linker/wild/releases/download/0.10.0/wild-linker-0.10.0-x86_64-unknown-linux-gnu.tar.gz | tar xz -C /tmp
          sudo cp /tmp/wild-linker-0.10.0-x86_64-unknown-linux-gnu/wild /usr/local/bin/wild
          sudo ln -sf /usr/local/bin/wild /usr/local/bin/ld.wild
          wild --version

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          # Shared cache across branches — main/master warms, PRs restore
          shared-key: "ci"
          # Don't thrash cache on every PR push
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache UI bundle
        id: ui-cache
        uses: actions/cache@v4
        with:
          # The generated app.js is committed; skip the rebuild (and the
          # downstream crate relink it triggers) when JS sources are unchanged.
          path: crates/ch-web-ui/assets/js/chat/app.js
          key: zw-ui-${{ hashFiles('crates/ch-web-ui/assets/js/chat/**', '!crates/ch-web-ui/assets/js/chat/app.js') }}

      - name: Bundle frontend JS
        if: steps.ui-cache.outputs.cache-hit != 'true'
        # app.js is served by the binary (layout.rs asset!) — rebuild from
        # modules BEFORE cargo build so the binary embeds fresh frontend.
        run: |
          cd crates/ch-web-ui/assets/js/chat
          bun build app-entry.js --format esm --external marked --external highlight.js --external katex --external mermaid --outfile app.js

      - name: cargo check
        run: cargo check --workspace --all-targets

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets

      - name: cargo test
        run: cargo test --workspace

      # Release artifact on main/master (expensive — skip on PRs)
      - name: cargo build (release)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        run: cargo build -p zw --release

      - name: Upload zw binary
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: zw-linux-x86_64
          path: target/release/zw
          retention-days: 14
          if-no-files-found: error

      - name: Cache topcoat-cli
        id: topcoat-cache
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        uses: actions/cache@v4
        with:
          # cargo install recompiles from source every run (~minutes);
          # reuse until the lockfile changes.
          path: /tmp/topcoat-cli
          key: topcoat-cli-${{ hashFiles('Cargo.lock') }}

      - name: Bundle assets
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ steps.topcoat-cache.outputs.cache-hit }}" != 'true' ]; then
            cargo install topcoat-cli --locked --root /tmp/topcoat-cli || true
          fi
          /tmp/topcoat-cli/bin/topcoat asset bundle --bin zw --release --out bundle-assets || topcoat asset bundle --bin zw --release --out bundle-assets

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

      - name: Upload assets bundle
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: zw-assets
          path: bundle-assets/
          retention-days: 14
          if-no-files-found: error

name: ${INSTANCE_NAME}
services:
  zw:
    image: debian:bookworm-slim
    container_name: zw-${INSTANCE_NAME}
    user: "1000:1000"
    environment:
      ZEROWRAPPER__ZEROCLAW_SOCKET: ${ZEROWRAPPER__ZEROCLAW_SOCKET}
      ZEROWRAPPER__DB_PATH: ${ZEROWRAPPER__DB_PATH}
      ZEROWRAPPER__CACHE_DIR: ${ZEROWRAPPER__CACHE_DIR}
      ZEROWRAPPER__MCP_TOKEN: ${ZEROWRAPPER_MCP_TOKEN}
      ZEROWRAPPER_CH_WEB__BIND: ${ZEROWRAPPER_CH_WEB__BIND}
      ZEROWRAPPER_CH_WEB__ALLOWED_ORIGINS: ${ZEROWRAPPER_CH_WEB__ALLOWED_ORIGINS}
      ZEROWRAPPER_CH_WEB__AGENT: ${ZEROWRAPPER_CH_WEB__AGENT}
      ZEROWRAPPER_CH_WEB__ACCOUNTS: ${ZEROWRAPPER_CH_WEB__ACCOUNTS}
      TOPCOAT_ASSETS_DIR: ${TOPCOAT_ASSETS_DIR}
      ZEROWRAPPER_CONFIG_DIR: ${ZEROWRAPPER_CONFIG_DIR}
      ZEROWRAPPER_LANDING_YAML: ${ZEROWRAPPER_LANDING_YAML}
      ZEROWRAPPER_SETTINGS_YAML: ${ZEROWRAPPER_SETTINGS_YAML}
      AGENTS_DIR: ${AGENTS_DIR}
    ports:
      - "${HOST_PORT}:9090"
    volumes:
      - ${ZW_BIN}:/usr/local/bin/zw:ro
      - ${BUNDLE_DIR}:/app/bundle:ro
      - ${DATA_DIR}:${DATA_DIR}
      - ${SOCKET_DIR}:${SOCKET_DIR}
      - ${AGENTS_DIR}:${AGENTS_DIR}:rw
      - ${CONFIG_DIR}:/app/config:ro
    working_dir: /app
    command: zw
    restart: always

[package]
name = "zw"
version = "0.1.0"
edition.workspace = true

[workspace]
resolver = "2"
members = [
    "zw-core",
    "zw-db",
    "zw-cache",
    "zw-mcp",
    "zw-channels",
    "zw-whiteboard",
    "zw-materials",
    "zw-expr",
    "zw-recipe",
    "crates/mcp-web-files-render",
    "crates/ch-web-ui",
]

[dependencies]
zw-core = { path = "zw-core" }
zw-db = { path = "zw-db" }
zw-cache = { path = "zw-cache" }
zw-mcp = { path = "zw-mcp" }
zw-channels = { path = "zw-channels" }
zw-whiteboard = { path = "zw-whiteboard" }
zw-materials = { path = "zw-materials" }
zw-expr = { path = "zw-expr" }
zw-recipe = { path = "zw-recipe" }
mcp-web-files-render = { path = "crates/mcp-web-files-render" }
ch-web-ui = { path = "crates/ch-web-ui" }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }

[workspace.dependencies]
turso = "0.8.0-pre.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
aes-gcm = "0.10"
rand = "0.8"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }
http-body-util = "0.1"
bytes = "1"
tokio-tungstenite = "0.29"
sha2 = "0.10"
base64 = "0.22"
mime_guess = "2"
async-trait = "0.1"
toml = "0.8"

[workspace.package]
edition = "2021"

[package]
name = "ch-web-ui"
version = "0.1.0"
edition.workspace = true

[lib]
name = "ch_web_ui"

[dependencies]
tokio = { workspace = true }
zw-core = { path = "../../zw-core" }
zw-db = { path = "../../zw-db" }
zw-cache = { path = "../../zw-cache" }
zw-whiteboard = { path = "../../zw-whiteboard" }
zw-mcp = { path = "../../zw-mcp" }
zw-materials = { path = "../../zw-materials" }
zw-recipe = { path = "../../zw-recipe" }
zw-agent-embed = { path = "../zw-agent-embed" }
async-trait = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = "0.9"
futures-util = "0.3"
tracing = { workspace = true }
chrono = { workspace = true }
mime_guess = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "http2"] }
sha2 = { workspace = true }
base64 = { workspace = true }
hmac = "0.12"
topcoat = { version = "0.5.0", default-features = false, features = [
    "view",
    "router",
    "asset",
    "tailwind",
    "font-fontsource",
    "icon-iconify",
    "discover",
    "serve",
    "sse",
    "websocket",
    "tower",
] }
tower-http = { version = "0.7", features = ["cors"] }
tower = "0.5"

[build-dependencies]
topcoat = { version = "0.5.0", default-features = false, features = [
    "icon-iconify",
    "tailwind",
] }

[lints.rust]
unused = "warn"
dead_code = "allow"

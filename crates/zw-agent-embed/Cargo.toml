[package]
name = "zw-agent-embed"
version = "0.1.0"
edition = "2021"

[dependencies]
# Pilser fork (adds src/lib.rs + Engine::run_streaming so the headless
# Engine is embeddable). CI fetches it from this URL — no local path.
#   • `features = ["acp"]`  → keep the ACP protocol
#   • `features = ["subagents"]` → subagent tool + task budget (wired in
#     new_engine via subagents::init; without init the tool would panic)
#   • `default-features = false` → drop the default TUI/CLI/loop extras
#   • `rev` pins the fork commit (stall + ask freeze + subagent ask).
zerostack = { git = "https://github.com/Pilser/zerostack.git",
              rev = "09a3d6919d5a39a78ceae8311548de9e0cf0e771",
              features = ["acp", "subagents"],
              default-features = false }
zw-core = { path = "../../zw-core" }
zw-db = { path = "../../zw-db" }
tokio = { version = "1", features = ["sync", "rt"] }
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
